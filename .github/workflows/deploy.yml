name: Deploy Care CMS to Hostinger

on:
  push:
    branches: [ yan-na-yon- ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: pdo_mysql, mysqli, gd, curl, json, mbstring, openssl, zip
        
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        cd assets
        npm install
        
    - name: Build CSS
      run: |
        cd assets
        npx tailwindcss -i ./src/input.css -o ./dist/output.css --minify
        
    - name: Create deployment package
      run: |
        # Create deployment directory
        mkdir -p deploy
        
        # Copy all files except development files
        rsync -av --exclude-from=.gitignore \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.github' \
          --exclude='*.md' \
          --exclude='test_*.php' \
          --exclude='debug_*.php' \
          --exclude='*.bat' \
          --exclude='*.sql' \
          --exclude='logs/' \
          --exclude='backup/' \
          --exclude='cache/' \
          --exclude='tmp/' \
          ./ deploy/
        
        # Ensure production config exists
        cp core/config.php deploy/core/config.php
        
        # Create necessary directories
        mkdir -p deploy/logs
        mkdir -p deploy/backup
        mkdir -p deploy/cache
        mkdir -p deploy/tmp
        
        # Set permissions
        chmod -R 755 deploy/
        chmod 644 deploy/.htaccess
        
    - name: Upload files to Hostinger
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: 65002
        source: "deploy/*"
        target: "/home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/"
        
    - name: Set permissions and cleanup
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: 65002
        script: |
          # Set proper permissions
          chmod -R 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/
          chmod 644 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/.htaccess
          
          # Create necessary directories if they don't exist
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/logs
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/backup
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/cache
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/tmp
          
          # Set directory permissions
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/logs
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/backup
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/cache
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/tmp
          
          # Clean up old files
          find /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/ -name "*.tmp" -delete
          find /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/ -name "*.log" -mtime +7 -delete
          
          echo "✅ Deployment completed successfully!"
          echo "🌐 Website: https://olshacare.com"
          echo "📱 Responsive design: Mobile, Tablet, Desktop optimized"
          
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to olshacare.com completed successfully!"
          echo "🚀 Your Care CMS is now live with enhanced responsiveness!"
        else
          echo "❌ Deployment failed!"
          echo "🔧 Check the logs above for details"
        fi
