name: Simple Deploy to Hostinger

on:
  push:
    branches: [ yan-na-yon- ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create deployment package
      run: |
        # Create deployment directory
        mkdir -p deploy
        
        # Copy all files except development files
        rsync -av --exclude-from=.gitignore \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.github' \
          --exclude='*.md' \
          --exclude='test_*.php' \
          --exclude='debug_*.php' \
          --exclude='*.bat' \
          --exclude='*.sql' \
          --exclude='logs/' \
          --exclude='backup/' \
          --exclude='cache/' \
          --exclude='tmp/' \
          ./ deploy/
        
        # Create production config
        cp core/config.php deploy/core/config.php
        
        # Create .htaccess for security
        cat > deploy/.htaccess << 'EOF'
        # Security Headers
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options DENY
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        
        # Hide sensitive files
        <Files "*.sql">
            Order allow,deny
            Deny from all
        </Files>
        
        <Files "*.log">
            Order allow,deny
            Deny from all
        </Files>
        
        <Files ".env*">
            Order allow,deny
            Deny from all
        </Files>
        
        # PHP Security
        php_flag display_errors Off
        php_flag log_errors On
        php_value max_execution_time 300
        php_value memory_limit 256M
        
        # Compression
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/plain
            AddOutputFilterByType DEFLATE text/html
            AddOutputFilterByType DEFLATE text/xml
            AddOutputFilterByType DEFLATE text/css
            AddOutputFilterByType DEFLATE application/xml
            AddOutputFilterByType DEFLATE application/xhtml+xml
            AddOutputFilterByType DEFLATE application/rss+xml
            AddOutputFilterByType DEFLATE application/javascript
            AddOutputFilterByType DEFLATE application/x-javascript
        </IfModule>
        
        # Cache Control
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 month"
            ExpiresByType application/javascript "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpg "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType image/gif "access plus 1 month"
            ExpiresByType image/svg+xml "access plus 1 month"
        </IfModule>
        
        # URL Rewriting
        RewriteEngine On
        
        # Force HTTPS
        RewriteCond %{HTTPS} off
        RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
        
        # Remove trailing slashes
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{THE_REQUEST} /+[^?\s]*?/[\s?]
        RewriteRule ^(.*)/$ /$1 [R=301,L]
        
        # Custom error pages
        ErrorDocument 404 /error_pages/404.php
        ErrorDocument 500 /error_pages/500.php
        EOF
        
        # Create robots.txt
        cat > deploy/robots.txt << 'EOF'
        User-agent: *
        Disallow: /admin/
        Disallow: /auth/
        Disallow: /api/
        Disallow: /logs/
        Disallow: /backup/
        Disallow: /cache/
        Disallow: /tmp/
        Disallow: /*.sql
        Disallow: /*.log
        Disallow: /*.env
        
        Sitemap: https://olshacare.com/sitemap.xml
        EOF
        
        # Create sitemap.xml
        cat > deploy/sitemap.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
                <loc>https://olshacare.com/</loc>
                <lastmod>2024-01-01</lastmod>
                <changefreq>weekly</changefreq>
                <priority>1.0</priority>
            </url>
            <url>
                <loc>https://olshacare.com/pages/about_us.php</loc>
                <lastmod>2024-01-01</lastmod>
                <changefreq>monthly</changefreq>
                <priority>0.8</priority>
            </url>
        </urlset>
        EOF
        
        # Create directories
        mkdir -p deploy/logs
        mkdir -p deploy/backup
        mkdir -p deploy/cache
        mkdir -p deploy/tmp
        
        # Set permissions
        chmod -R 755 deploy/
        chmod 644 deploy/.htaccess
        chmod 644 deploy/robots.txt
        chmod 644 deploy/sitemap.xml
        
    - name: Upload files to Hostinger
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: 22
        source: "deploy/*"
        target: "/home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/"
        
    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: 22
        script: |
          # Set proper permissions
          chmod -R 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/
          chmod 644 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/.htaccess
          chmod 644 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/robots.txt
          chmod 644 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/sitemap.xml
          
          # Create necessary directories
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/logs
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/backup
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/cache
          mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/tmp
          
          # Set directory permissions
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/logs
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/backup
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/cache
          chmod 755 /home/${{ secrets.HOSTINGER_USERNAME }}/domains/olshacare.com/public_html/tmp
          
          echo "Deployment completed successfully!"
          
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to olshacare.com completed successfully!"
        else
          echo "❌ Deployment failed!"
        fi
