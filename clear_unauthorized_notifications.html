<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Unauthorized Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl p-8 max-w-md w-full">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Clear Unauthorized Notifications</h1>
            <p class="text-gray-600">This tool will remove all unauthorized access notifications from your browser storage.</p>
        </div>

        <div id="status" class="mb-6 p-4 rounded-lg bg-gray-50 hidden">
            <p class="text-sm text-gray-700"></p>
        </div>

        <button onclick="clearNotifications()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 mb-4">
            Clear Notifications
        </button>

        <button onclick="window.close()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-6 rounded-lg transition-colors duration-200">
            Close
        </button>

        <div class="mt-6 p-4 bg-blue-50 rounded-lg">
            <h3 class="text-sm font-semibold text-blue-900 mb-2">What this does:</h3>
            <ul class="text-sm text-blue-800 space-y-1">
                <li>• Removes unauthorized_access notifications from localStorage</li>
                <li>• Clears closed notification tracking</li>
                <li>• Resets notification persistence</li>
            </ul>
        </div>
    </div>

    <script>
        function showStatus(message, type = 'success') {
            const statusDiv = document.getElementById('status');
            const statusText = statusDiv.querySelector('p');
            
            statusDiv.classList.remove('hidden', 'bg-green-50', 'bg-red-50', 'bg-blue-50');
            
            if (type === 'success') {
                statusDiv.classList.add('bg-green-50');
                statusText.className = 'text-sm text-green-700';
            } else if (type === 'error') {
                statusDiv.classList.add('bg-red-50');
                statusText.className = 'text-sm text-red-700';
            } else {
                statusDiv.classList.add('bg-blue-50');
                statusText.className = 'text-sm text-blue-700';
            }
            
            statusText.textContent = message;
        }

        function clearNotifications() {
            try {
                let clearedCount = 0;
                
                // Clear global notifications
                const stored = localStorage.getItem('globalNotifications');
                if (stored) {
                    const notifications = JSON.parse(stored);
                    const filtered = notifications.filter(n => 
                        !n.message.includes('unauthorized_access') && 
                        !n.message.includes('Unauthorized access attempt to:')
                    );
                    
                    clearedCount = notifications.length - filtered.length;
                    
                    if (filtered.length > 0) {
                        localStorage.setItem('globalNotifications', JSON.stringify(filtered));
                    } else {
                        localStorage.removeItem('globalNotifications');
                    }
                }
                
                // Clear closed notifications tracking
                const closedNotifications = localStorage.getItem('closedNotifications');
                if (closedNotifications) {
                    try {
                        const closed = JSON.parse(closedNotifications);
                        const filteredClosed = closed.filter(id => 
                            !id.includes('unauthorized') && 
                            !id.includes('Unauthorized')
                        );
                        
                        if (filteredClosed.length !== closed.length) {
                            clearedCount += (closed.length - filteredClosed.length);
                            if (filteredClosed.length > 0) {
                                localStorage.setItem('closedNotifications', JSON.stringify(filteredClosed));
                            } else {
                                localStorage.removeItem('closedNotifications');
                            }
                        }
                    } catch (e) {
                        localStorage.removeItem('closedNotifications');
                    }
                }
                
                if (clearedCount > 0) {
                    showStatus(`✅ Successfully cleared ${clearedCount} unauthorized notification(s)!`, 'success');
                } else {
                    showStatus('ℹ️ No unauthorized notifications found to clear.', 'info');
                }
                
                // Reload the page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'admin/dashboard.php';
                }, 2000);
                
            } catch (error) {
                console.error('Error clearing notifications:', error);
                showStatus('❌ Error clearing notifications: ' + error.message, 'error');
            }
        }

        // Show initial status
        window.addEventListener('DOMContentLoaded', () => {
            showStatus('Ready to clear unauthorized notifications.', 'info');
        });
    </script>
</body>
</html>
