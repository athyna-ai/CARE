{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-clinic-ivory via-white to-clinic-vanilla">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-comfortaa font-bold text-clinic-dark mb-2">
                {% if faculty %}Edit Faculty{% else %}Faculty Registration{% endif %}
            </h1>
            <p class="text-gray-600">Complete the form below to register a new faculty member</p>
        </div>
        
        <!-- Faculty Registration Form -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form method="post" class="grid md:grid-cols-2 gap-4 flex-1 overflow-y-auto" autocomplete="on">
                {% csrf_token %}
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                
                <!-- Full Name -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        Full Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" 
                           id="name" 
                           name="name" 
                           value="{{ faculty.name|default:'' }}"
                           required 
                           autofocus
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                           placeholder="Enter full name">
                </div>
                
                <!-- Department -->
                <div>
                    <label for="department" class="block text-sm font-medium text-gray-700 mb-2">
                        Department
                    </label>
                    <input type="text" 
                           id="department" 
                           name="department" 
                           value="{{ faculty.department|default:'' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                           placeholder="Enter department">
                </div>
                
                <!-- Gender -->
                <div>
                    <label for="gender" class="block text-sm font-medium text-gray-700 mb-2">
                        Gender <span class="text-red-500">*</span>
                    </label>
                    <select id="gender" 
                            name="gender" 
                            required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue">
                        <option value="">Select Gender</option>
                        <option value="Male" {% if faculty.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if faculty.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if faculty.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                
                <!-- RFID Number -->
                <div>
                    <label for="rfid" class="block text-sm font-medium text-gray-700 mb-2">
                        RFID Number <span class="text-red-500">*</span>
                    </label>
                    <input type="text" 
                           id="rfid" 
                           name="rfid" 
                           value="{{ prefill_rfid|default:faculty.rfid|default:'' }}"
                           required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                           placeholder="Enter RFID number">
                </div>
                
                <!-- Complete Address -->
                <div class="md:col-span-2">
                    <label for="address" class="block text-sm font-medium text-gray-700 mb-2">
                        Complete Address
                    </label>
                    <textarea id="address" 
                              name="address" 
                              rows="3"
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                              placeholder="Enter complete address">{{ faculty.address|default:'' }}</textarea>
                </div>
                
                <!-- Date of Birth -->
                <div>
                    <label for="dob" class="block text-sm font-medium text-gray-700 mb-2">
                        Date of Birth <span class="text-red-500">*</span>
                    </label>
                    <input type="date" 
                           id="dob" 
                           name="dob" 
                           value="{{ faculty.dob|default:'' }}"
                           required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue">
                </div>
                
                <!-- Age (Auto-calculated) -->
                <div>
                    <label for="age" class="block text-sm font-medium text-gray-700 mb-2">
                        Age
                    </label>
                    <input type="number" 
                           id="ageInput" 
                           name="age" 
                           value="{{ faculty.age|default:'' }}"
                           readonly
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue">
                </div>
                
                <!-- Religion -->
                <div>
                    <label for="religion" class="block text-sm font-medium text-gray-700 mb-2">
                        Religion
                    </label>
                    <select id="religion" 
                            name="religion"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue">
                        <option value="">Select Religion</option>
                        <option value="Catholic" {% if faculty.religion == 'Catholic' %}selected{% endif %}>Catholic</option>
                        <option value="Protestant" {% if faculty.religion == 'Protestant' %}selected{% endif %}>Protestant</option>
                        <option value="Muslim" {% if faculty.religion == 'Muslim' %}selected{% endif %}>Muslim</option>
                        <option value="Buddhist" {% if faculty.religion == 'Buddhist' %}selected{% endif %}>Buddhist</option>
                        <option value="Hindu" {% if faculty.religion == 'Hindu' %}selected{% endif %}>Hindu</option>
                        <option value="Other" {% if faculty.religion == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                
                <!-- Emergency Contact -->
                <div>
                    <label for="emergency_contact" class="block text-sm font-medium text-gray-700 mb-2">
                        Emergency Contact
                    </label>
                    <input type="text" 
                           id="emergency_contact" 
                           name="emergency_contact" 
                           value="{{ faculty.emergency_contact|default:'' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                           placeholder="Enter emergency contact">
                </div>
                
                <!-- Employee ID -->
                <div>
                    <label for="employee_id" class="block text-sm font-medium text-gray-700 mb-2">
                        Employee ID
                    </label>
                    <input type="text" 
                           id="employee_id" 
                           name="employee_id" 
                           value="{{ faculty.employee_id|default:'' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                           placeholder="Enter employee ID">
                </div>
                
                <!-- Position -->
                <div>
                    <label for="position" class="block text-sm font-medium text-gray-700 mb-2">
                        Position
                    </label>
                    <input type="text" 
                           id="position" 
                           name="position" 
                           value="{{ faculty.position|default:'' }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                           placeholder="Enter position">
                </div>
                
                <!-- Allergies -->
                <div class="md:col-span-2">
                    <label for="allergies" class="block text-sm font-medium text-gray-700 mb-2">
                        Allergies
                    </label>
                    <textarea id="allergies" 
                              name="allergies" 
                              rows="3"
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                              placeholder="List any known allergies">{{ faculty.allergies|default:'' }}</textarea>
                </div>
                
                <!-- Medical Notes -->
                <div class="md:col-span-2">
                    <label for="medical_notes" class="block text-sm font-medium text-gray-700 mb-2">
                        Medical Notes
                    </label>
                    <textarea id="medical_notes" 
                              name="medical_notes" 
                              rows="3"
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:border-clinic-blue"
                              placeholder="Additional medical information">{{ faculty.medical_notes|default:'' }}</textarea>
                </div>
                
                <!-- Data Privacy Consent -->
                <div class="md:col-span-2">
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <div class="flex items-start">
                            <input type="checkbox" 
                                   id="data_privacy_consent" 
                                   name="data_privacy_consent" 
                                   required
                                   class="mt-1 h-4 w-4 text-clinic-blue focus:ring-clinic-blue border-gray-300 rounded">
                            <label for="data_privacy_consent" class="ml-3 text-sm text-gray-700">
                                <span class="font-medium text-red-500">*</span> I consent to the collection, processing, and storage of my personal data for medical and administrative purposes. I understand that this information will be used solely for healthcare services and will be kept confidential in accordance with data protection regulations.
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <div class="md:col-span-2 text-center">
                    <button type="submit" 
                            id="saveFacultyBtn" 
                            disabled
                            class="px-8 py-3 bg-clinic-blue text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-clinic-blue focus:ring-offset-2 transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">
                        {% if faculty %}Update Faculty{% else %}Register Faculty{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dobInput = document.getElementById('dob');
    const ageInput = document.getElementById('ageInput');
    const saveBtn = document.getElementById('saveFacultyBtn');
    const consentCheckbox = document.getElementById('data_privacy_consent');
    
    // Age calculation
    function calculateAge() {
        if (dobInput.value) {
            const today = new Date();
            const birthDate = new Date(dobInput.value);
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            ageInput.value = age;
        }
    }
    
    // Enable/disable save button based on consent
    function updateSaveButton() {
        if (consentCheckbox.checked) {
            saveBtn.disabled = false;
        } else {
            saveBtn.disabled = true;
        }
    }
    
    // Event listeners
    dobInput.addEventListener('change', calculateAge);
    consentCheckbox.addEventListener('change', updateSaveButton);
    
    // Auto-capitalize name fields
    const nameInput = document.getElementById('name');
    const departmentInput = document.getElementById('department');
    const positionInput = document.getElementById('position');
    
    [nameInput, departmentInput, positionInput].forEach(input => {
        input.addEventListener('input', function() {
            this.value = this.value.replace(/\b\w/g, l => l.toUpperCase());
        });
    });
    
    // Initialize save button state
    updateSaveButton();
});
</script>
{% endblock %}
